{% extends "base.html" %}

{% block title %}Sign up · SpartieSwap{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="p-4 bg-white border rounded">
      <h1 class="h4 mb-3">Create your account</h1>
      {% if form.non_field_errors %}
        <div class="alert alert-danger">{{ form.non_field_errors }}</div>
      {% endif %}
      <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_div }}
        <button type="submit" class="btn btn-dark w-100 mt-3">Create account</button>
      </form>
      <p class="small text-secondary mt-3 mb-0">
        Already have an account? <a href="{% url 'accounts:login' %}">Log in</a>.
      </p>
    </div>
  </div>
</div>
{% endblock %}
