name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: spartieswap
          POSTGRES_USER: spartieswap
          POSTGRES_PASSWORD: spartieswap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spartieswap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-insecure-key
      DJANGO_DEBUG: "False"
      DATABASE_URL: postgres://spartieswap:spartieswap@localhost:5432/spartieswap
      CAMPUS_EMAIL_DOMAIN: case.edu

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity 2
