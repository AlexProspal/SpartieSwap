name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets. Limiting this to PRs into main meant
  # a PR between two feature branches got no checks at all and showed up with an
  # empty checks list, which reads like nothing was configured.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: spartieswap
          POSTGRES_USER: spartieswap
          POSTGRES_PASSWORD: spartieswap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spartieswap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-insecure-key
      DJANGO_DEBUG: "False"
      DATABASE_URL: postgres://spartieswap:spartieswap@localhost:5432/spartieswap
      CAMPUS_EMAIL_DOMAIN: case.edu

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # These three run independently. Without always() a lint slip stops the job
      # before the tests, and the red X looks like the tests failed when they were
      # never run - that confused us on #28. The job still fails if any step does.
      - name: Lint
        run: ruff check .

      - name: Check for missing migrations
        if: always()
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        if: always()
        run: coverage run manage.py test --verbosity 2

      - name: Coverage report
        if: always()
        run: |
          coverage report
          coverage html
          coverage xml

      # Grab this from the run's Artifacts section to see the line-by-line report.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          retention-days: 30
