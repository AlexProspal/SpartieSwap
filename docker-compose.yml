services:
  db:
    image: postgres:16
    container_name: spartieswap-db
    environment:
      POSTGRES_DB: spartieswap
      POSTGRES_USER: spartieswap
      POSTGRES_PASSWORD: spartieswap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spartieswap"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
